# NovaTech Terraform CI/CD Pipeline
# TODO: Vervollständige diesen GitHub Actions Workflow

name: "Terraform CI/CD"

on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  pull_request:
    branches: [main]
    paths: ["terraform/**"]

    # TODO: Definiere die benötigten Permissions
permissions:
   contents: read
   pull-requests: write

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest

    steps:
      # TODO 1: Checkout
      # - uses: actions/checkout@v4
        - name: Checkout
          uses: actions/checkout@v7


      # TODO 2: Terraform Setup
      # - uses: hashicorp/setup-terraform@v3
      #   with:
      #     terraform_version: "1.7.0"
        - name: Terraform Setup
          uses: hashicorp/setup-terraform@v4
          with:
            terraform_version: "1.14.6"

      # TODO 3: Terraform Format Check
      # - name: Terraform Format
      #   run: terraform fmt -check -recursive
      #   working-directory: ./terraform
        - name: Terraform Format Check
          run: terraform fmt -check -recursive -diff
          working-directory: ./terraform


      # TODO 4: Terraform Init
      # - name: Terraform Init
      #   run: terraform init
      #   working-directory: ./terraform
        - name: Init
          run: terraform init
          working-directory: ./terraform

      # TODO 5: Terraform Validate
      # - name: Terraform Validate
      #   run: terraform validate
      #   working-directory: ./terraform
        - name: validate
          run: terraform validate
          working-directory: ./terraform

      # TODO 6: TFLint
        - name: TFLint
          run: |
            curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
            tflint --init
            tflint
          working-directory: ./terraform

      # TODO 7: tfsec Security Scan
        - name: tfsec
          uses: aquasecurity/tfsec-action@v1.0.3
          with:
            working_directory: ./terraform

      # TODO 8: Terraform Plan (nur bei PRs)
  plan:    
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ./terraform
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
    

  apply:
      # TODO 9: Terraform Apply (nur bei Push auf main)
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform
